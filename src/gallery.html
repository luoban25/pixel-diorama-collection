<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="description" content="板球场、钓鱼池塘、西部列车与街头篮球，独立保存的像素三维微缩场景。">
  <title>像素微缩场景</title>
  <style>
    :root{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:#38503f;background:#fff;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}[hidden]{display:none!important}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
    main{position:relative;width:100%;height:100svh;background:#fff;isolation:isolate}
    iframe{position:absolute;inset:0;width:100%;height:100%;display:block;border:0;background:#fff}
    .scenes{position:absolute;z-index:2;left:50%;bottom:max(30px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:28px;background:rgba(255,255,255,.96);box-shadow:0 1px 3px #22372c0a,0 5px 24px #22372c0d,0 0 0 1px #22372c0a}
    .scenes button{height:44px;min-width:94px;padding:0 20px;border:0;border-radius:23px;background:transparent;color:#617065;white-space:nowrap;font:12px/1 Arial,"PingFang SC","Microsoft YaHei",sans-serif;cursor:pointer;transition:background-color 160ms ease,color 160ms ease,transform 160ms ease}
    .scenes button:hover{background:#f2f5ee;color:#38503f}.scenes button[aria-pressed="true"]{background:#eaf0e5;color:#38503f}
    .scenes button:focus-visible{outline:2px solid #55764b;outline-offset:4px}.scenes button:active{transform:scale(.96)}
    @media(max-width:600px){.scenes{bottom:max(24px,env(safe-area-inset-bottom))}.scenes{max-width:calc(100vw - 24px)}.scenes button{min-width:0;flex:1;padding:0 13px;font-size:11px}}
    @media(max-height:479px){.scenes{bottom:max(14px,env(safe-area-inset-bottom))}}
    @media(prefers-reduced-motion:reduce){.scenes button{transition:none}}
  </style>
</head>
<body>
  <main id="gallery" aria-label="三维微缩场景">
    <nav class="scenes" aria-label="切换项目场景">
      <button type="button" data-scene="cricket" aria-controls="scene-cricket" aria-pressed="false">板球场</button>
      <button type="button" data-scene="pond" aria-controls="scene-pond" aria-pressed="false">钓鱼池塘</button>
      <button type="button" data-scene="western" aria-controls="scene-western" aria-pressed="false">西部列车</button>
      <button type="button" data-scene="basketball" aria-controls="scene-basketball" aria-pressed="false">街头篮球</button>
    </nav>
  </main>
  <script>
    /* EMBEDDED_SCENES */
    (()=>{
      const gallery=document.getElementById('gallery'),buttons=[...document.querySelectorAll('[data-scene]')];
      const names={cricket:'板球场',pond:'钓鱼池塘',western:'西部列车',basketball:'街头篮球'},frames=new Map();
      let active='pond';
      function notify(frame,isActive){frame.contentWindow?.postMessage({type:'diorama:active',active:isActive},'*');}
      function createFrame(id){
        const frame=document.createElement('iframe');frame.id='scene-'+id;frame.title=names[id]+'三维场景';frame.tabIndex=-1;frame.hidden=true;
        frame.srcdoc=new TextDecoder().decode(Uint8Array.from(atob(scenePages[id]),c=>c.charCodeAt(0)));
        frame.addEventListener('load',()=>notify(frame,active===id));gallery.prepend(frame);frames.set(id,frame);return frame;
      }
      function select(id,persist=true){
        if(!Object.hasOwn(names,id))return;
        active=id;frames.get(id)||createFrame(id);
        for(const [key,frame] of frames){frame.hidden=key!==id;notify(frame,key===id);}
        for(const button of buttons)button.setAttribute('aria-pressed',String(button.dataset.scene===id));
        document.title=names[id]+' · 像素微缩场景';
        window.__GALLERY__={active:id,projects:Object.keys(names),loaded:[...frames.keys()]};
        if(persist){try{localStorage.setItem('pixel-diorama-scene',id);}catch{}const url=new URL(location.href);url.searchParams.set('scene',id);history.replaceState(null,'',url);}
      }
      window.addEventListener('message',event=>{
        if(event.data?.type!=='diorama:ready')return;
        for(const [id,frame] of frames)if(event.source===frame.contentWindow)notify(frame,id===active);
      });
      buttons.forEach(button=>button.addEventListener('click',()=>select(button.dataset.scene)));
      let initial=new URLSearchParams(location.search).get('scene');
      if(!initial){try{initial=localStorage.getItem('pixel-diorama-scene');}catch{}}
      select(Object.hasOwn(names,initial)?initial:'pond',false);
    })();
  </script>
</body>
</html>
