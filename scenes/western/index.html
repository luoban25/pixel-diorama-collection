<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>西部列车</title>
  <style>

    html,body,.page,#stage{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}

  </style>
</head>

    <div class="toolbar" hidden aria-hidden="true">
